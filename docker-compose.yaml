# nginx proxy address - http://172.17.0.1:8083

name: feedbin
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  feedbin:
    image: feedbin/feedbin:latest
    pull_policy: always
    container_name: feedbin-app
    restart: always
    logging: *default-logging
    networks:
      - feedbin
    ports:
      - "172.17.0.1:8083:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      SECRET_KEY_BASE: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DATABASE_URL: postgres://${DB_USER_NAME:-feedbin}:${DB_USER_PASS:-changeme_db_password}@feedbin-db:5432/${DB_CREATE_DATABASE_NAME:-feedbin}
      SINGLE_USER_MODE: ${SINGLE_USER_MODE:-false}
    volumes:
      - ./volumes/data/feedbin:/data
    depends_on:
      - feedbin-db

  feedbin-db:
    image: postgres:latest
    pull_policy: always
    container_name: feedbin-db
    restart: always
    logging: *default-logging
    networks:
      - feedbin
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-feedbin}
      POSTGRES_USER: ${DB_USER_NAME:-feedbin}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/feedbin:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  feedbin:
    name: feedbin
    external: false
